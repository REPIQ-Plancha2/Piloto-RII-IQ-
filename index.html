<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piloto RII-IQ | UNAL Sede Bogotá</title>
    <!-- Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React y Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .unal-green { background-color: #005C38; }
        .unal-border { border-color: #005C38; }
        .unal-text { color: #005C38; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Base de Datos Oficial de 54 Materias de la Malla de IQ (Plan 2874)
        const OFFICIAL_SUBJECTS = [
            // DISCIPLINAR OBLIGATORIA
            { code: '2015707', name: 'Balance de energía y equilibrio químico', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015708', name: 'Balance de materia', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015710', name: 'Control de procesos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015712', name: 'Diseño de plantas y equipos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015713', name: 'Diseño de procesos químicos y bioquímicos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015714', name: 'Fluidos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015715', name: 'Ingeniería de Procesos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015716', name: 'Ingeniería de Reacciones Químicas', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015718', name: 'Introducción a la ingeniería química', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015719', name: 'Laboratorio de fluidos, sólidos y transferencia de calor', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015720', name: 'Laboratorio de operaciones de separación, reaccion y control', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015721', name: 'Laboratorio de propiedades termodinámicas y de transporte', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015726', name: 'Manejo de sólidos', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015731', name: 'Operaciones de Separación', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2024045', name: 'Taller de proyectos interdisciplinarios', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015735', name: 'Taller 1', credits: 1, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015736', name: 'Taller 2', credits: 1, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015741', name: 'Termodinámica', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015740', name: 'Termodinámica química', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015743', name: 'Transferencia de calor', credits: 4, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            { code: '2015744', name: 'Transferencia de masa', credits: 3, type: 'DISCIPLINAR OBLIGATORIA (C)' },
            
            // FUNDAMENTACIÓN OBLIGATORIA
            { code: '1000003-B', name: 'Álgebra Lineal', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000010-B', name: 'Biología molecular y celular', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000004-B', name: 'Cálculo diferencial', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000006-B', name: 'Cálculo en varias variables', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000005-B', name: 'Cálculo Integral', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000007-B', name: 'Ecuaciones Diferenciales', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000017-B', name: 'Fundamentos de electricidad y magnetismo', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000019-B', name: 'Fundamentos de mecánica', credits: 4, type: 'FUND. OBLIGATORIA (B)' },
            { code: '2015702', name: 'Gerencia y gestión de proyectos', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '2015703', name: 'Ingeniería económica', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000027-B', name: 'Laboratorio principios de análisis químico', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000031-B', name: 'Laboratorio principios de química orgánica', credits: 2, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000025-B', name: 'Laboratorio tecnicas básicas en química', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '2015970', name: 'Métodos numéricos', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000026-B', name: 'Principios de análisis químico', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000024-B', name: 'Principios de química', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000028-B', name: 'Principios de química inorgánica', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000030-B', name: 'Principios de química orgánica', credits: 3, type: 'FUND. OBLIGATORIA (B)' },
            { code: '1000013-B', name: 'Probabilidad y estadística fundamental', credits: 3, type: 'FUND. OBLIGATORIA (B)' },

            // DISCIPLINAR OPTATIVA
            { code: '2017256', name: 'Ciencia e ingeniería de materiales', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '1000038-B', name: 'Fisicoquímica II', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '1000040-B', name: 'Introducción a la ciencia de materiales', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '2024929', name: 'Introducción a la Ingeniería de Materiales Poliméricos', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '2015729', name: 'Modelamiento y simulación de procesos químicos', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '2015738', name: 'Termodinámica de Ciclos', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },
            { code: '2015739', name: 'Termodinámica molecular', credits: 3, type: 'DISCIPLINAR OPTATIVA (T)' },

            // FUNDAMENTACIÓN OPTATIVA
            { code: '2015709', name: 'Comunicación oral y escrita', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2015711', name: 'Dibujo básico', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2015695', name: 'Diseño, gestión y evaluación de proyectos', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2016592', name: 'Economía general', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2016741', name: 'Finanzas', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2015734', name: 'Programación de computadores', credits: 3, type: 'FUND. OPTATIVA (O)' },
            { code: '2016609', name: 'Seguridad industrial', credits: 3, type: 'FUND. OPTATIVA (O)' }
        ];

        function App() {
            const [view, setView] = useState('student'); // 'student' | 'admin'
            const [studentCode, setStudentCode] = useState('');
            const [email, setEmail] = useState('');
            const [selectedSubjects, setSelectedSubjects] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterType, setFilterType] = useState('ALL');
            const [submitted, setSubmitted] = useState(false);

            const filteredSubjects = useMemo(() => {
                return OFFICIAL_SUBJECTS.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          s.code.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesType = filterType === 'ALL' || s.type.includes(filterType);
                    return matchesSearch && matchesType;
                });
            }, [searchTerm, filterType]);

            const handleToggleSubject = (subject) => {
                const exists = selectedSubjects.find(s => s.code === subject.code);
                if (exists) {
                    const updated = selectedSubjects.filter(s => s.code !== subject.code)
                        .map((s, idx) => ({ ...s, priority: idx + 1 }));
                    setSelectedSubjects(updated);
                } else {
                    if (selectedSubjects.length >= 5) {
                        alert("Solo puedes seleccionar un MÁXIMO de 5 asignaturas priorizadas.");
                        return;
                    }
                    setSelectedSubjects([
                        ...selectedSubjects, 
                        { ...subject, priority: selectedSubjects.length + 1, preferredSlot: 'Mañana' }
                    ]);
                }
            };

            const handlePriorityChange = (index, direction) => {
                const newSubjects = [...selectedSubjects];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newSubjects.length) return;
                
                const temp = newSubjects[index];
                newSubjects[index] = newSubjects[targetIndex];
                newSubjects[targetIndex] = temp;
                
                const reordered = newSubjects.map((s, idx) => ({ ...s, priority: idx + 1 }));
                setSelectedSubjects(reordered);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!email.endsWith('@unal.edu.co')) {
                    alert('Debes ingresar tu correo institucional institucional (@unal.edu.co)');
                    return;
                }
                if (selectedSubjects.length === 0) {
                    alert('Debes seleccionar al menos 1 asignatura para enviar la intención.');
                    return;
                }
                setSubmitted(true);
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-6">
                    {/* ENCABEZADO INSTITUCIONAL */}
                    <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4 mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-xl unal-green text-white flex items-center justify-center font-bold text-xl shadow-md">
                                    UN
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-900 leading-tight">Piloto RII-IQ (Plan 2874)</h1>
                                    <p className="text-xs text-slate-500 font-medium">Departamento de Ingeniería Química y Ambiental — Sede Bogotá</p>
                                </div>
                            </div>
                            
                            {/* BOTÓN VISTA ESTUDIANTE / ADMON */}
                            <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                                <button 
                                    onClick={() => setView('student')}
                                    className={`px-3 py-1.5 rounded-lg transition-all ${view === 'student' ? 'bg-white shadow-sm unal-text font-bold' : 'text-slate-600'}`}>
                                    <i className="fa-solid fa-user-graduate mr-1.5"></i> Vista Estudiante
                                </button>
                                <button 
                                    onClick={() => setView('admin')}
                                    className={`px-3 py-1.5 rounded-lg transition-all ${view === 'admin' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600'}`}>
                                    <i className="fa-solid fa-lock mr-1.5"></i> Panel Administración
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center justify-between text-xs text-slate-600 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span className="font-semibold unal-text"><i className="fa-regular fa-calendar-check mr-1"></i> Ventana de recolección: 7 de Diciembre – 16 de Diciembre</span>
                            <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold"><i className="fa-solid fa-circle text-[8px] mr-1"></i> Piloto Oficial DIQA</span>
                        </div>
                    </header>

                    {/* VISTA ESTUDIANTE */}
                    {view === 'student' && (
                        submitted ? (
                            <div className="bg-white rounded-2xl shadow-sm border border-emerald-200 p-8 text-center space-y-4">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                    <i className="fa-solid fa-check"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-900">¡Intención Registrada Exitosamente!</h2>
                                <p className="text-sm text-slate-600 max-w-md mx-auto">
                                    Tus asignaturas priorizadas han sido consolidadas para el reporte de oferta del Comité Asesor del DIQA.
                                </p>
                                <button 
                                    onClick={() => { setSubmitted(false); setSelectedSubjects([]); }}
                                    className="unal-green text-white px-6 py-2.5 rounded-xl font-semibold text-sm hover:opacity-95 transition-opacity">
                                    Registrar nueva respuesta
                                </button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-6">
                                {/* PASO 1: DATOS */}
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                    <h2 className="text-sm font-bold uppercase tracking-wider unal-text flex items-center gap-2">
                                        <i className="fa-solid fa-id-card"></i> 1. Identificación Académica
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Correo Institucional (@unal.edu.co)</label>
                                            <input 
                                                type="email" 
                                                required 
                                                placeholder="usuario@unal.edu.co"
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Documento / Código Estudiantil</label>
                                            <input 
                                                type="text" 
                                                required 
                                                placeholder="1000XXXXXX"
                                                value={studentCode}
                                                onChange={(e) => setStudentCode(e.target.value)}
                                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* PASO 2: SELECCIÓN */}
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                        <h2 className="text-sm font-bold uppercase tracking-wider unal-text flex items-center gap-2">
                                            <i className="fa-solid fa-list-check"></i> 2. Selecciona Materias (Máximo 5)
                                        </h2>
                                        <span className="text-xs font-bold px-3 py-1 bg-slate-100 rounded-full text-slate-700">
                                            Seleccionadas: {selectedSubjects.length} / 5
                                        </span>
                                    </div>

                                    {/* BUSCADOR */}
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Buscar por código o nombre de materia..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600"
                                        />
                                        <select 
                                            value={filterType}
                                            onChange={(e) => setFilterType(e.target.value)}
                                            className="px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white text-slate-700 font-medium">
                                            <option value="ALL">Todas las tipologías</option>
                                            <option value="DISCIPLINAR OBLIGATORIA">Disciplinar Obligatoria</option>
                                            <option value="FUND. OBLIGATORIA">Fundamentación Obligatoria</option>
                                            <option value="DISCIPLINAR OPTATIVA">Disciplinar Optativa</option>
                                            <option value="FUND. OPTATIVA">Fundamentación Optativa</option>
                                        </select>
                                    </div>

                                    {/* LISTADO ASIGNATURAS */}
                                    <div className="max-h-64 overflow-y-auto divide-y divide-slate-100 border border-slate-100 rounded-xl">
                                        {filteredSubjects.map((sub) => {
                                            const isSelected = selectedSubjects.some(s => s.code === sub.code);
                                            return (
                                                <div 
                                                    key={sub.code}
                                                    onClick={() => handleToggleSubject(sub)}
                                                    className={`p-3 flex items-center justify-between cursor-pointer transition-colors ${isSelected ? 'bg-emerald-50/70' : 'hover:bg-slate-50'}`}>
                                                    <div className="pr-2">
                                                        <span className="text-[10px] font-bold text-slate-400 block">{sub.code} • {sub.credits} Créditos</span>
                                                        <p className="text-xs font-bold text-slate-800">{sub.name}</p>
                                                        <span className="text-[9px] font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded mt-0.5 inline-block">{sub.type}</span>
                                                    </div>
                                                    <div>
                                                        {isSelected ? (
                                                            <span className="w-6 h-6 rounded-full unal-green text-white flex items-center justify-center text-xs">
                                                                <i className="fa-solid fa-check"></i>
                                                            </span>
                                                        ) : (
                                                            <span className="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs text-slate-400">
                                                                <i className="fa-solid fa-plus"></i>
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* PASO 3: PRIORIZACIÓN */}
                                {selectedSubjects.length > 0 && (
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                        <h2 className="text-sm font-bold uppercase tracking-wider unal-text flex items-center gap-2">
                                            <i className="fa-solid fa-arrow-down-short-wide"></i> 3. Prioriza tus Materias (Orden 1 al {selectedSubjects.length})
                                        </h2>
                                        <p className="text-xs text-slate-500">Usa las flechas para subir tu materia de mayor prioridad al puesto #1.</p>

                                        <div className="space-y-2">
                                            {selectedSubjects.map((sub, idx) => (
                                                <div key={sub.code} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                                                    <div className="flex items-center gap-3">
                                                        <span className="w-7 h-7 rounded-lg font-bold unal-green text-white flex items-center justify-center text-xs">
                                                            #{idx + 1}
                                                        </span>
                                                        <div>
                                                            <p className="font-bold text-slate-800">{sub.name}</p>
                                                            <p className="text-[10px] text-slate-500">{sub.code} • {sub.credits} créditos</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-1">
                                                        <button 
                                                            type="button"
                                                            onClick={() => handlePriorityChange(idx, -1)}
                                                            disabled={idx === 0}
                                                            className="p-1.5 bg-white border border-slate-200 rounded-lg text-slate-600 disabled:opacity-30">
                                                            <i className="fa-solid fa-chevron-up"></i>
                                                        </button>
                                                        <button 
                                                            type="button"
                                                            onClick={() => handlePriorityChange(idx, 1)}
                                                            disabled={idx === selectedSubjects.length - 1}
                                                            className="p-1.5 bg-white border border-slate-200 rounded-lg text-slate-600 disabled:opacity-30">
                                                            <i className="fa-solid fa-chevron-down"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <button 
                                    type="submit"
                                    className="w-full unal-green text-white font-bold py-3 rounded-2xl shadow-md hover:opacity-95 transition-opacity text-sm">
                                    Enviar Intención de Inscripción RII-IQ
                                </button>
                            </form>
                        )
                    )}

                    {/* VISTA ADMINISTRACIÓN (SOLO PARA TI Y EL COMITÉ) */}
                    {view === 'admin' && (
                        <div className="space-y-6">
                            <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-sm space-y-3">
                                <div className="flex items-center justify-between">
                                    <h2 className="font-bold text-lg text-emerald-400">Panel de Control & Analítica DIQA</h2>
                                    <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full font-mono">Modo Administrador</span>
                                </div>
                                <p className="text-xs text-slate-300">
                                    Este panel es de acceso privado para la Representación Estudiantil y el Comité Asesor. Los estudiantes no lo ven al responder.
                                </p>
                            </div>

                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                                <h3 className="font-bold text-sm text-slate-800">Demanda Proyectada por Materia (Vista Previa)</h3>
                                <div className="space-y-3 text-xs">
                                    {OFFICIAL_SUBJECTS.slice(0, 6).map((sub, i) => (
                                        <div key={sub.code} className="space-y-1">
                                            <div className="flex justify-between font-semibold">
                                                <span>{sub.name} ({sub.code})</span>
                                                <span className="unal-text font-bold">{75 - i * 8} solicitudes</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2">
                                                <div className="unal-green h-2 rounded-full" style={{ width: `${85 - i * 10}%` }}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
